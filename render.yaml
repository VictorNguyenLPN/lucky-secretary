services:
  - type: web
    name: lucky-secretary
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEFAULT_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: DEFAULT_EVENT_DURATION
        value: "60"
      - key: CONFIRMATION_TIMEOUT_MINUTES
        value: "15"
      - key: OPENAI_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GOOGLE_TOKEN_PATH
        value: /app/data/google_token.json
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/data/lucky_secretary.db
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: TAVILY_API_KEY
        sync: false

